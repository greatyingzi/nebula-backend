# 星云后端单镜像部署: core + embed + rerank 三服务在一个容器内
# 构建前把模型放到 ./models/ (见 README), 然后 docker compose up -d --build
services:
  nebula:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebula-all
    restart: unless-stopped
    ports:
      - "${NEBULA_PORT:-9200}:9200"
      - "${NEBULA_MCP_PORT:-9300}:9300"
      - "${NEBULA_EMBED_PORT:-8300}:8300"
      - "${NEBULA_RERANK_PORT:-8301}:8301"
    environment:
      - NEBULA_DATA=/data
      - NEBULA_TOKEN_FILE=/run/secrets/token
      # 默认用容器内服务; 也可指向外部 embed/rerank (含完整路径)
      - NEBULA_EMBED_URL=${NEBULA_EMBED_URL:-http://127.0.0.1:8300/v1/embeddings}
      - NEBULA_RERANK_URL=${NEBULA_RERANK_URL:-http://127.0.0.1:8301/v1/rerank}
    volumes:
      - ${NEBULA_DATA_DIR:-./data}:/data
      - ${NEBULA_TOKEN_FILE:-./secrets/token}:/run/secrets/token:ro
