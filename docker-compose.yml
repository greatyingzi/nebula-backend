services:
  nebula-core:
    build:
      context: .
      dockerfile: docker/Dockerfile.core
    container_name: nebula-core
    restart: unless-stopped
    ports:
      - "${NEBULA_PORT:-9200}:9200"
      - "${NEBULA_MCP_PORT:-9300}:9300"
    environment:
      - NEBULA_DATA=/data
      - NEBULA_EMBED_URL=${NEBULA_EMBED_URL:-http://embed:8300}
      - NEBULA_RERANK_URL=${NEBULA_RERANK_URL:-http://rerank:8301}
      - NEBULA_EMBED_DIM=${NEBULA_EMBED_DIM:-1024}
      - NEBULA_TOKEN_FILE=/run/secrets/nebula_token
    volumes:
      - ${NEBULA_DATA_DIR:-./data}:/data
      - ${NEBULA_TOKEN_FILE:-./secrets/token}:/run/secrets/nebula_token:ro
    depends_on:
      embed:
        condition: service_healthy
      rerank:
        condition: service_healthy

  embed:
    build:
      context: .
      dockerfile: docker/Dockerfile.embed
    container_name: nebula-embed
    restart: unless-stopped
    ports:
      - "${NEBULA_EMBED_PORT:-8300}:8300"
    command: ["--embeddings", "--pooling", "mean", "--port", "8300", "-b", "4096", "-ub", "4096"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8300/health"]
      interval: 30s
      timeout: 5s
      retries: 10

  rerank:
    build:
      context: .
      dockerfile: docker/Dockerfile.rerank
    container_name: nebula-rerank
    restart: unless-stopped
    ports:
      - "${NEBULA_RERANK_PORT:-8301}:8301"
    command: ["--rerank", "--port", "8301", "-b", "4096", "-ub", "4096"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8301/health"]
      interval: 30s
      timeout: 5s
      retries: 10
