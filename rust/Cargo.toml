[workspace]
members = ["nebula-sync-rs", "nebula-mcp-rs"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"

[workspace.dependencies]
once_cell = "1.20"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "fs", "signal", "sync", "process"] }
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
rusqlite = { version = "0.31", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
base64 = "0.22"
hmac = "0.12"
flate2 = "1.0"
chrono = { version = "0.4", features = ["clock"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots", "connect"], default-features = false }
futures-util = "0.3"
http = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"